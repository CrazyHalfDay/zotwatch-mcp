# ZotWatch QQ 机器人 — docker compose。
#
# 机器人复用宿主机上一套已有的 ZotWatch 项目(它的 config/、.env 和 data/）。
# 把下面 volumes 的左边改成你自己的 AIZotWatch 路径即可。

services:
  zotwatch-bot:
    build: .
    image: zotwatch-bot
    restart: always
    # QQ_BOT_APPID / QQ_BOT_SECRET(以及可选 QQ_BOT_ALLOWED_USERS)放在
    # 本目录的 .env 里;.env 已被 gitignore,不会误提交。
    env_file:
      - .env
    environment:
      # ZotWatch 项目在容器内的挂载点(保持 /zotwatch)。
      ZOTWATCH_DIR: /zotwatch
    volumes:
      # 左边 = 你 VPS 上 AIZotWatch 目录的绝对路径;右边保持 /zotwatch。
      - /root/AIZotWatch:/zotwatch

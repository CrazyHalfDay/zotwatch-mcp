# ZotWatch WeChat bot — docker compose.
#
# The bot reuses an existing ZotWatch project on the host (its config/, .env and
# data/). Edit the volume path below to point at YOUR AIZotWatch directory.

services:
  zotwatch-bot:
    build: .
    image: zotwatch-bot
    restart: always
    environment:
      # Where the ZotWatch project is mounted INSIDE the container (leave as-is).
      ZOTWATCH_DIR: /zotwatch
      # Persist the iLink login token alongside the data on the host so it
      # survives restarts (no second volume needed).
      ILINK_TOKEN_FILE: /zotwatch/data/ilink_token.json
      # Optional: comma-separated WeChat-id whitelist.
      # ILINK_ALLOWED_USERS: ""
    volumes:
      # LEFT side = path to YOUR AIZotWatch dir on the VPS. Edit it.
      # RIGHT side must stay /zotwatch.
      - /root/AIZotWatch:/zotwatch
